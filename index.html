<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Español en Bici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16130f; --panel:#231e18; --panel2:#2e2720; --line:#3d342a;
    --text:#f4ede4; --muted:#b5a896; --accent:#ff7a1a; --accent2:#ffb347;
    --good:#4cc36b; --bad:#ff5a5a; --sky:#5fb4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif}
  body{min-height:100vh;background:
    radial-gradient(1200px 500px at 50% -200px,#3a2a18 0%,transparent 70%),var(--bg)}
  button{font-family:inherit;cursor:pointer}
  .es{direction:ltr;unicode-bidi:isolate;font-weight:600}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;
    position:sticky;top:0;z-index:5;background:rgba(22,19,15,.92);backdrop-filter:blur(6px);
    padding:10px 16px;border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:18px;direction:ltr}
  .logo span{color:var(--accent)}
  .stats{display:flex;gap:10px;font-weight:600;font-size:15px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  h1{font-size:26px;margin:8px 0}
  h2{font-size:20px;margin:6px 0 10px}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
    padding:14px 20px;font-size:17px;font-weight:600;background:var(--accent);color:#1b1006;
    box-shadow:0 4px 0 #b24d00;transition:transform .05s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b24d00}
  .btn.full{width:100%}
  .btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #120f0b}
  .btn.small{padding:8px 12px;font-size:15px}
  .btn:disabled{opacity:.45;cursor:default}
  .speak{border:0;background:var(--sky);color:#06213a;border-radius:12px;padding:8px 12px;font-size:18px;
    box-shadow:0 3px 0 #2a6ea8}
  .speak:active{transform:translateY(2px);box-shadow:0 1px 0 #2a6ea8}
  input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:18px;font-family:inherit}

  /* trail map */
  .trail{position:relative;margin:10px 0 20px}
  .node{display:flex;align-items:center;gap:14px;margin:0 0 18px;position:relative}
  .node:nth-child(even){margin-right:60px}
  .dot{width:72px;height:72px;flex:0 0 72px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:32px;border:4px solid var(--line);background:var(--panel2)}
  .node.done .dot{border-color:var(--good);background:#1f3a26}
  .node.open .dot{border-color:var(--accent);background:#3a2410;animation:pulse 1.6s infinite}
  .node.locked{opacity:.45}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.5)}50%{box-shadow:0 0 0 12px rgba(255,122,26,0)}}
  .node .info b{display:block;font-size:17px}
  .node .info small{color:var(--muted)}
  .node button.go{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%}
  .chapter-head{background:linear-gradient(135deg,#ff7a1a33,#5fb4ff22);border:1px solid var(--line);
    border-radius:18px;padding:16px;margin:12px 0}

  /* lesson */
  .progress{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .big-es{font-size:38px;margin:6px 0;direction:ltr;text-align:center;font-weight:800}
  .pron{text-align:center;color:var(--accent2);font-size:20px}
  .mean{text-align:center;font-size:22px;margin-top:8px}
  .center{text-align:center}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{padding:15px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text);
    font-size:18px;text-align:center}
  .opt.sel{border-color:var(--sky)}
  .opt.right{border-color:var(--good);background:#1f3a26}
  .opt.wrong{border-color:var(--bad);background:#3e1d1d}
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .match .opt.gone{visibility:hidden}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;min-height:56px;padding:10px;
    border-bottom:2px dashed var(--line);margin:12px 0}
  .tile{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);
    font-size:18px;direction:ltr;font-weight:600}
  .tile.used{visibility:hidden}
  .feedback{position:fixed;left:0;right:0;bottom:0;padding:16px;z-index:10;transform:translateY(110%);transition:transform .2s}
  .feedback.show{transform:none}
  .feedback .inner{max-width:640px;margin:0 auto}
  .feedback.ok{background:#1c3524;border-top:3px solid var(--good)}
  .feedback.no{background:#3a1b1b;border-top:3px solid var(--bad)}
  .feedback h3{margin:0 0 6px}
  .dlg{display:flex;flex-direction:column;gap:10px}
  .line{display:flex;gap:10px;align-items:flex-start}
  .line.me{flex-direction:row-reverse}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--panel2);border:2px solid var(--line)}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;flex:1}
  .line.me .bubble{background:#3a2410;border-color:#6b3d14}
  .bubble .es{display:block;font-size:18px;text-align:left}
  .bubble small{color:var(--muted)}
  .who{font-size:13px;color:var(--accent2);font-weight:600}
  .tip{background:#1d2b3a;border:1px solid #2c4763;border-radius:14px;padding:12px 14px;margin:12px 0}
  .mission{background:#2b2312;border:1px dashed var(--accent2);border-radius:14px;padding:14px;margin:12px 0}
  .trick{font-size:90px;text-align:center;margin:10px 0}
  .trick.anim{animation:trick 1.4s ease-in-out 2}
  @keyframes trick{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-50px) rotate(-25deg)}
    60%{transform:translateY(-20px) rotate(-360deg)}100%{transform:translateY(0) rotate(-360deg)}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:rgba(22,19,15,.96);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:4}
  .navbar button{background:none;border:0;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px}
  .navbar button.on{color:var(--accent)}
  .navbar button span{font-size:22px}
  table.pr{width:100%;border-collapse:collapse}
  table.pr td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  .x{background:none;border:0;color:var(--muted);font-size:26px}
  .warn{background:#3a2a10;border:1px solid #7a5520;border-radius:12px;padding:10px;font-size:14px;margin:8px 0}
</style>
</head>

/* ---------- exercise generation ---------- */
function pool(L){const own=L.words;const extra=learnedWords().filter(w=>!own.includes(w));return own.concat(extra)}
function mcEsHe(w,P){return {t:'mc',prompt:'מה הפירוש?',show:w[0],sayIt:w[0],answer:w[1],opts:shuffle([w[1],...sample(P.filter(x=>x[1]!==w[1]),3).map(x=>x[1])]),word:w}}
function mcHeEs(w,P){return {t:'mc',prompt:'איך אומרים בספרדית?',showHe:w[1],answer:w[0],esOpts:true,opts:shuffle([w[0],...sample(P.filter(x=>x[0]!==w[0]),3).map(x=>x[0])]),word:w}}
function listen(w,P){return {t:'mc',prompt:'מה שמעת?',listen:w[0],answer:w[0],esOpts:true,opts:shuffle([w[0],...sample(P.filter(x=>x[0]!==w[0]),3).map(x=>x[0])]),word:w}}
function matchEx(ws){return {t:'match',pairs:ws.slice(0,5)}}
function buildEx(line,P){
  const toks=line[1].split(' ');
  const extras=sample(P.map(w=>w[0]).filter(s=>!s.includes(' ')&&!toks.map(norm).includes(norm(s))),2);
  return {t:'build',he:line[2],answer:line[1],tiles:shuffle(toks.concat(extras))};
}
function buildLessonQueue(L){
  const P=pool(L);const W=L.words;
  const q=[];
  W.forEach(w=>q.push(mcEsHe(w,P)));
  sample(W,Math.min(5,W.length)).forEach(w=>q.push(mcHeEs(w,P)));
  sample(W,4).forEach(w=>q.push(listen(w,P)));
  q.push(matchEx(sample(W,5)));
  const mixed=shuffle(q);
  L.build.forEach(i=>mixed.push(buildEx(L.dialogue[i],P)));
  return mixed;
}
function buildReviewQueue(){
  const W=learnedWords();
  const weighted=W.flatMap(w=>Array(1+Math.min(4,S.errs[wordKey(w)]||0)).fill(w));
  const picks=[];const used=new Set();
  for(const w of shuffle(weighted)){if(!used.has(w[0])){used.add(w[0]);picks.push(w)}if(picks.length>=10)break}
  const q=picks.map((w,i)=>[mcEsHe,mcHeEs,listen][i%3](w,W));
  q.push(matchEx(sample(W,5)));
  return shuffle(q);
}

/* ---------- practice runner ---------- */
function startPractice(queue,mode){
  R=Object.assign(R||{},{q:queue,i:0,total:queue.length,mode,correct:0,firstTry:0,retry:new Set()});
  nextEx();
}
function nextEx(){
  hideFb();
  if(R.i>=R.q.length) return finish();
  const ex=R.q[R.i];
  const prog=R.mode==='lesson'?0.35+0.6*(R.i/R.q.length):R.i/R.q.length;
  ({mc:renderMC,match:renderMatch,build:renderBuild})[ex.t](ex,prog);
}
function result(ok,ex,correctText){
  const fb=$('#fb');
  const isRetry=R.retry.has(ex);
  if(ok){R.correct++;if(!isRetry){R.firstTry++;S.xp+=R.mode==='lesson'?10:5}}
  else{
    if(ex.word){S.errs[wordKey(ex.word)]=(S.errs[wordKey(ex.word)]||0)+1}
    if(!isRetry){R.retry.add(ex);R.q.push(ex)}
  }
  save();renderStats();
  const praise=['¡Muy bien!','¡Genial!','¡Perfecto!','¡Qué guay!','¡Eso es!'];
  fb.className='feedback show '+(ok?'ok':'no');
  $('#fbInner').innerHTML=`<h3>${ok?'✅ <span class="es">'+praise[Math.floor(Math.random()*praise.length)]+'</span>':'❌ לא נורא — זה יחזור בסוף'}</h3>
    ${ok?'':`<p>התשובה הנכונה: <b class="${/[a-záéíóúñ¿¡]/i.test(correctText)?'es':''}">${esc(correctText)}</b></p>`}
    <button class="btn full" id="cont">המשך ←</button>`;
  if(ok&&ex.word) say(ex.word[0]);
  $('#cont').onclick=()=>{R.i++;nextEx()};
}

function renderMC(ex,prog){
  let head='';
  if(ex.show) head=`<div class="big-es">${esc(ex.show)}</div><div class="center">${speakBtn(ex.show)}</div>`;
  else if(ex.showHe) head=`<div class="mean" style="font-size:28px;font-weight:700">${esc(ex.showHe)}</div>`;
  else if(ex.listen) head=`<div class="center" style="margin:10px 0">${speakBtn(ex.listen).replace('class="speak"','class="speak" style="font-size:40px;padding:18px 26px"')} ${speakBtn(ex.listen,true)}</div>`;
  $('#app').innerHTML=lessonShell(`<h2>${ex.prompt}</h2><div class="card">${head}</div>
    <div class="opts">${ex.opts.map((o,i)=>`<button class="opt ${ex.esOpts?'es':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`,prog);
  bindQuit();
  if(ex.listen||ex.show) setTimeout(()=>say(ex.listen||ex.show),250);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const pick=ex.opts[+b.dataset.i];const ok=pick===ex.answer;
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(ex.opts[+x.dataset.i]===ex.answer)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    result(ok,ex,ex.answer);
  });
}

function renderMatch(ex,prog){
  const L=shuffle(ex.pairs.map((p,i)=>({i,txt:p[0],es:true}))),Rt=shuffle(ex.pairs.map((p,i)=>({i,txt:p[1]})));
  $('#app').innerHTML=lessonShell(`<h2>התאם זוגות</h2><p class="muted">לחץ על מילה בספרדית ואז על הפירוש שלה</p>
    <div class="match"><div class="opts" style="margin:0">${L.map(x=>`<button class="opt es" data-s="L" data-i="${x.i}">${esc(x.txt)}</button>`).join('')}</div>
    <div class="opts" style="margin:0">${Rt.map(x=>`<button class="opt" data-s="R" data-i="${x.i}">${esc(x.txt)}</button>`).join('')}</div></div>`,prog);
  bindQuit();
  let sel=null,left=ex.pairs.length,mistakes=0;
  document.querySelectorAll('.match .opt').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('gone'))return;
    if(b.dataset.s==='L') say(ex.pairs[+b.dataset.i][0]);
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
    if(sel.dataset.i===b.dataset.i){
      [sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('right');setTimeout(()=>x.classList.add('gone'),250)});
      sel=null;left--;
      if(!left) setTimeout(()=>{if(!mistakes)S.xp+=R.mode==='lesson'?10:5;R.correct++;save();renderStats();R.i++;nextEx()},350);
    }else{
      mistakes++;const a=sel,c=b;[a,c].forEach(x=>x.classList.add('wrong'));
      const w=ex.pairs[+(a.dataset.s==='L'?a:c).dataset.i];S.errs[wordKey(w)]=(S.errs[wordKey(w)]||0)+1;save();
      setTimeout(()=>[a,c].forEach(x=>x.classList.remove('wrong','sel')),500);sel=null;
    }
  });
}

function renderBuild(ex,prog){
  let chosen=[];
  const draw=()=>{
    $('#app').innerHTML=lessonShell(`<h2>בנה את המשפט בספרדית</h2>
      <div class="card"><div class="mean" style="margin:0">${esc(nm(ex.he))}</div></div>
      <div class="tiles" id="ans">${chosen.map((ti,k)=>`<button class="tile" data-k="${k}">${esc(ex.tiles[ti])}</button>`).join('')}</div>
      <div class="tiles" style="border:0">${ex.tiles.map((t,ti)=>`<button class="tile ${chosen.includes(ti)?'used':''}" data-t="${ti}">${esc(t)}</button>`).join('')}</div>
      <button class="btn full" id="check" ${chosen.length?'':'disabled'}>בדוק</button>`,prog);
    bindQuit();
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const ti=+b.dataset.t;if(!chosen.includes(ti)){chosen.push(ti);say(ex.tiles[ti]);draw()}});
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.k,1);draw()});
    $('#check').onclick=()=>{
      const got=norm(chosen.map(ti=>ex.tiles[ti]).join(' '));const ok=got===norm(ex.answer);
      document.querySelectorAll('.tile').forEach(t=>t.disabled=true);
      result(ok,ex,ex.answer);if(ok)say(ex.answer);
    };
  };
  draw();
}

function finish(){
  hideFb();touchStreak();
  if(R.mode==='review'){
    S.xp+=10;save();renderStats();
    $('#app').innerHTML=`<div class="card center"><div style="font-size:60px">💪</div><h1 class="es">¡Buen trabajo!</h1>
      <p>${R.firstTry} מתוך ${R.total} נכון בניסיון הראשון · +10 ⭐ בונוס</p></div>
      <button class="btn full" id="again">עוד סבב</button><div style="height:10px"></div><button class="btn ghost full" id="back">חזרה</button>`;
    $('#again').onclick=()=>startPractice(buildReviewQueue(),'review');
    $('#back').onclick=()=>{R=null;home()};
    return;
  }
  const {id,L}=R;const first=!S.done[id];
  S.done[id]=true;if(first)S.xp+=20;save();renderStats();
  $('#app').innerHTML=`
    <div class="card center">
      <h1 class="es">¡Lección completada!</h1>
      <p class="muted">${R.firstTry} מתוך ${R.total} נכון בניסיון הראשון${first?' · +20 ⭐ בונוס':''}</p>
      <div class="trick anim">${L.trick.emoji}</div>
      <h2>פעלול חדש נפתח: <span class="es">${L.trick.name}</span></h2>
    </div>
    <div class="mission"><b>🎯 משימת משפחה</b><p>${L.mission.he}</p>
      <div class="row between"><span class="es" style="font-size:19px">${esc(L.mission.es)}</span>${speakBtn(L.mission.es)}</div>
      <p class="muted" style="margin-bottom:0">אחרי שביצעת — סמן בלשונית "משימות" ותקבל +15 ⭐</p></div>
    <button class="btn full" id="back">חזרה למסלול 🗺️</button>`;
  say('¡Muy bien, '+S.name+'!');
  $('#back').onclick=()=>{R=null;tab='map';home()};
}

function practiceView(){
  const W=learnedWords();
  if(!W.length){$('#app').innerHTML=`<h1>תרגול 🏋️</h1><div class="card muted">אחרי השיעור הראשון יופיע כאן תרגול חוזר. המילים שטעית בהן יחזרו יותר.</div>`;return}
  const hard=W.filter(w=>(S.errs[wordKey(w)]||0)>0).sort((a,b)=>S.errs[wordKey(b)]-S.errs[wordKey(a)]).slice(0,6);
  $('#app').innerHTML=`<h1>תרגול 🏋️</h1>
    <p class="muted">סבב קצר של 11 תרגילים מכל מה שלמדת. המילים שקשות לך מופיעות יותר.</p>
    <button class="btn full" id="go">התחל סבב תרגול</button>
    ${hard.length?`<h2 style="margin-top:20px">המילים שהכי קשות לך</h2><div class="card">${hard.map(w=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><b class="es">${esc(w[0])}</b> — ${esc(w[1])}</span>${speakBtn(w[0])}</div>`).join('')}</div>`:''}
    <h2 style="margin-top:20px">כל המילים (${W.length})</h2>
    <div class="card">${W.map(w=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><b class="es">${esc(w[0])}</b> — ${esc(w[1])}</span>${speakBtn(w[0])}</div>`).join('')}</div>`;
  $('#go').onclick=()=>{R={};startPractice(buildReviewQueue(),'review')};
}

home();
</script>
